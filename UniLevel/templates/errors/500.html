{% extends "layouts/base.html" %}

{% block title %}Error 500 - Error del servidor{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="mb-4">
                <i class="fas fa-server" style="font-size: 5rem; color: #e74c3c;"></i>
            </div>
            <h1 class="display-1 fw-bold">500</h1>
            <h2 class="mb-3">Error del Servidor</h2>
            <p class="lead mb-4">
                Lo sentimos, algo salió mal en nuestro servidor. Por favor, intenta más tarde.
            </p>
            <a href="/" class="btn btn-lg btn-primary">
                <i class="fas fa-home"></i> Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
