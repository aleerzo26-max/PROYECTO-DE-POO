{% extends "layouts/base.html" %}

{% block title %}Editar Calificación - UniLevel{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="h3 fw-bold"><i class="fas fa-edit"></i> Editar Calificación</h1>
            <p class="text-muted">Actualiza la nota o el comentario registrado.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Evaluación</label>
                            <input type="text" name="evaluacion" class="form-control" value="{{ calificacion.evaluacion }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nota</label>
                            <input type="number" step="0.1" min="0" max="10" name="nota" class="form-control" value="{{ calificacion.nota }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Comentario</label>
                            <textarea name="comentario" class="form-control" rows="3">{{ calificacion.comentario }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a href="{{ url_for('listar_calificaciones_docente') }}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
