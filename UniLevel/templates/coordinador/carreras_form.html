{% extends "admin/base_admin.html" %}

{% block page_title %}{% if carrera %}Editar Carrera{% else %}Crear Carrera{% endif %}{% endblock %}

{% block admin_content %}
<div class="card admin-card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input name="nombre" class="form-control" value="{{ carrera.nombre if carrera else '' }}" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Código</label>
                <input name="codigo" class="form-control" value="{{ carrera.codigo if carrera else '' }}" />
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control">{{ carrera.descripcion if carrera else '' }}</textarea>
            </div>
            <button class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('listar_carreras') }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
