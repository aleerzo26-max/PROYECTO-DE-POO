{% extends "admin/base_admin.html" %}

{% block page_title %}{% if asignatura %}Editar Asignatura{% else %}Crear Asignatura{% endif %}{% endblock %}

{% block admin_content %}
<div class="card admin-card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input name="nombre" class="form-control" value="{{ asignatura.nombre if asignatura else '' }}" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Código</label>
                <input name="codigo" class="form-control" value="{{ asignatura.codigo if asignatura else '' }}" />
            </div>
            <div class="mb-3">
                <label class="form-label">Créditos</label>
                <input name="creditos" type="number" class="form-control" value="{{ asignatura.creditos if asignatura else 0 }}" />
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control">{{ asignatura.descripcion if asignatura else '' }}</textarea>
            </div>
            <button class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('listar_asignaturas') }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
