{% extends "base.html" %}
{% block content %}
<div class="card">
	<h2>Mis Tareas</h2>
	<div class="tasks">
		{% for t in tareas %}
		<div class="task-card">
			<div class="task-title">{{ t.titulo }}</div>
			<div class="muted">{{ t.descripcion }}</div>
			<div style="margin-top:10px"><span class="badge pending">Pendiente</span></div>
		</div>
		{% else %}
		<p>No tienes tareas subidas aún.</p>
		{% endfor %}
	</div>
</div>
{% endblock %}
