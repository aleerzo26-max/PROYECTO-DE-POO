{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Subir Tarea</h2>
    <p class="muted">En la siguiente fase se guardará el archivo y la información de la tarea.</p>

    <form method="post" enctype="multipart/form-data">
        <div class="form-group"><label class="muted">Título</label><div class="input"><input type="text" name="titulo" required></div></div>
        <div class="form-group"><label class="muted">Descripción</label><div class="input"><input type="text" name="descripcion"></div></div>
        <div class="form-group"><label class="muted">Archivo</label><div class="input"><input type="file" name="archivo"></div></div>
        <div style="text-align:right"><button class="btn-primary" type="submit">Subir</button></div>
    </form>
</div>
{% endblock %}
